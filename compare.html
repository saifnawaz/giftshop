        // Function to populate product dropdown
        function populateProductDropdown() {
            const product1Select = document.getElementById('product1');
            const product2Select = document.getElementById('product2');

            products.forEach(product => {
                const option1 = document.createElement('option');
                option1.value = product.id;
                option1.textContent = product.name;
                product1Select.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = product.id;
                option2.textContent = product.name;
                product2Select.appendChild(option2);
            });
        }

        // Function to compare products
        function compareProducts() {
            const product1Id = document.getElementById('product1').value;
            const product2Id = document.getElementById('product2').value;

            const product1 = products.find(product => product.id == product1Id);
            const product2 = products.find(product => product.id == product2Id);

            const comparisonTable = document.getElementById('comparison-result');

            comparisonTable.innerHTML = `
                <div class="product">
                    <img src="${product1.img}" alt="${product1.name}">
                    <h3>${product1.name}</h3>
                    <ul>
                        <li>Price: ${product1.price}</li>
                        <li>Feature 1: ${product1.feature1}</li>
                        <li>Feature 2: ${product1.feature2}</li>
                        <li>Rating: ${product1.rating}</li>
                    </ul>
                </div>
                <div class="vs">VS</div>
                <div class="product">
                    <img src="${product2.img}" alt="${product2.name}">
                    <h3>${product2.name}</h3>
                    <ul>
                        <li>Price: ${product2.price}</li>
                        <li>Feature 1: ${product2.feature1}</li>
                        <li>Feature 2: ${product2.feature2}</li>
                        <li>Rating: ${product2.rating}</li>
                    </ul>
                </div>
            `;
        }

        // Initializing product dropdowns
        window.onload = populateProductDropdown;
